name: Save reading progress

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/save-progress.yml'
      - '.github/scripts/save-progress.mjs'

permissions:
  contents: write

concurrency:
  group: save-progress
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Merge relayed ticks into progress.json
        run: node .github/scripts/save-progress.mjs

      - name: Commit
        run: |
          if git diff --quiet -- progress.json; then echo "Nothing new to save"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress.json
          git commit -q -m 'Save reading progress'
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            sleep 5
            git pull -q --rebase origin main
          done
          exit 1
